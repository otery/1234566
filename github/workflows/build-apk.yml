name: Build APK

# 수동 실행 버튼 + main 브랜치 푸시 시 자동 빌드
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub 러너에는 Android SDK 가 이미 설치되어 있어서 별도 설치가 필요 없습니다.
      - name: Android SDK 확인
        uses: android-actions/setup-android@v3

      # gradle-wrapper.jar 없이도 빌드되도록 Gradle 을 직접 설치해 사용합니다.
      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 디버그 APK 빌드
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: FoldReveal-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
